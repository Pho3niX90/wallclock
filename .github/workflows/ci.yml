name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The recorded CPython answers, the unit tests, and every example in
      # the README, the guide and the API documentation.
      - run: cargo test
      - run: cargo test --features bundled

  lint:
    name: Format, clippy and docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --all-features

  sweep:
    name: Every zone against CPython
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Python and the crate both read the runner's own /usr/share/zoneinfo
      # here, so any difference is a difference in behaviour.
      - name: Record CPython's answers for every zone
        run: python tests/record_vectors.py --sweep "$RUNNER_TEMP/sweep.jsonl"
      - name: Ask the crate the same
        run: cargo test --test cpython -- --ignored --nocapture
        env:
          SWEEP: ${{ runner.temp }}/sweep.jsonl
      # The recorded set must not depend on the machine it was recorded on.
      - name: The recorded answers are the same here
        run: |
          python tests/record_vectors.py
          python - <<'PY'
          import json, subprocess
          recorded = json.loads(subprocess.run(["git", "show", "HEAD:tests/vectors/cpython.json"], capture_output=True, text=True, check=True).stdout)
          here = json.load(open("tests/vectors/cpython.json", encoding="utf-8"))
          assert recorded["cases"] == here["cases"], "the recorded answers differ on this machine"
          print(len(here["cases"]), "answers are the same here")
          PY
